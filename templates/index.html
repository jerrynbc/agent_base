<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain智能体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-4 flex-1 flex flex-col lg:flex-row gap-6">
            <!-- 配置面板 -->
            <div id="config-panel" class="lg:w-1/3 bg-white rounded-lg shadow-md p-6 transition-all duration-300 transform lg:translate-x-0 relative z-10">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold flex items-center">
                        <i class="fa fa-cog mr-2 text-blue-500"></i> 模型配置
                    </h2>
                    <button id="toggle-config" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                </div>
                <form id="config-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 地址</label>
                        <input type="text" id="api-base" name="api_base" value="{{ config.api_base }}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 密钥</label>
                        <input type="password" id="api-key" name="api_key" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ config.api_key|default('') }}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型</label>
                        <input type="text" id="model" name="model" value="{{ config.model }}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入模型名称">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">温度</label>
                        <input type="number" id="temperature" name="temperature" value="{{ config.temperature }}" step="0.1" min="0" max="2" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">最大令牌数</label>
                        <input type="number" id="max-tokens" name="max_tokens" value="{{ config.max_tokens }}" min="1" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">系统提示词</label>
                        <textarea id="system-prompt" name="system_prompt" rows="4" 
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ config.system_prompt }}</textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors flex items-center justify-center">
                        <i class="fa fa-save mr-2"></i> 保存配置
                    </button>
                </form>
            </div>
            <!-- 展开按钮 -->
            <div id="expand-btn" class="lg:w-12 lg:h-48 lg:flex items-center justify-center bg-green-500 text-white rounded-r-lg shadow-md p-2 hidden fixed left-0 top-10 z-20">
                <button id="toggle-expand" class="vertical-text font-bold hover:bg-green-600 transition-colors">
                    <i class="fa fa-cog mb-2"></i> 配置参数
                </button>
            </div>
            <!-- 对话面板 -->
            <div class="lg:w-2/3 flex flex-col transition-all duration-300 flex-1">
                <div class="bg-white rounded-lg shadow-md flex-1 flex flex-col h-full">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fa fa-comments mr-2 text-blue-500"></i> 智能对话
                        </h2>
                        <button id="clear-history" class="text-gray-500 hover:text-gray-700 flex items-center">
                            <i class="fa fa-trash mr-1"></i> 清空历史
                        </button>
                    </div>
                    <div id="chat-history" class="flex-1 p-4 overflow-y-auto space-y-4 max-h-[70vh] min-h-[400px]">
                        <!-- 对话历史将通过JavaScript动态添加 -->
                    </div>
                    <div class="p-4 border-t border-gray-200">
                        <form id="chat-form" class="flex gap-2">
                            <input type="text" id="message-input" placeholder="请输入消息..." 
                                   class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition-colors">
                                <i class="fa fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 配置面板收纳功能
            const toggleConfigBtn = document.getElementById('toggle-config');
            if (toggleConfigBtn) {
                toggleConfigBtn.addEventListener('click', function() {
                    const configPanel = document.getElementById('config-panel');
                    const expandBtn = document.getElementById('expand-btn');
                    const chatPanel = document.querySelector('[class*="lg:w-2/3"]');
                    
                    // 收纳配置面板
                    configPanel.classList.add('-translate-x-full');
                    setTimeout(() => {
                        configPanel.classList.add('hidden');
                        expandBtn.classList.remove('hidden');
                        if (chatPanel) {
                            chatPanel.classList.remove('lg:w-2/3');
                            chatPanel.classList.add('lg:w-full');
                        }
                    }, 300);
                });
            }
            
            // 展开配置面板
            const toggleExpandBtn = document.getElementById('toggle-expand');
            if (toggleExpandBtn) {
                toggleExpandBtn.addEventListener('click', function() {
                    const configPanel = document.getElementById('config-panel');
                    const expandBtn = document.getElementById('expand-btn');
                    const chatPanel = document.querySelector('[class*="lg:w-full"]');
                    
                    // 展开配置面板
                    expandBtn.classList.add('hidden');
                    configPanel.classList.remove('hidden');
                    setTimeout(() => {
                        configPanel.classList.remove('-translate-x-full');
                        if (chatPanel) {
                            chatPanel.classList.remove('lg:w-full');
                            chatPanel.classList.add('lg:w-2/3');
                        }
                    }, 10);
                });
            }
            
            // 发送消息
            const chatForm = document.getElementById('chat-form');
            if (chatForm) {
                chatForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const messageInput = document.getElementById('message-input');
                    const message = messageInput.value.trim();
                    if (!message) return;
                    
                    // 添加用户消息到界面
                    addMessageToHistory('user', message);
                    messageInput.value = '';
                    
                    // 显示思考中提示
                    const thinkingId = 'thinking-' + Date.now();
                    const chatHistory = document.getElementById('chat-history');
                    const thinkingDiv = document.createElement('div');
                    thinkingDiv.id = thinkingId;
                    thinkingDiv.className = 'flex justify-start';
                    thinkingDiv.innerHTML = `
                        <div class="max-w-[80%] bg-gray-100 text-gray-800 p-3 rounded-lg shadow-sm">
                            <span class="thinking-text">思考中...</span>
                        </div>
                    `;
                    chatHistory.appendChild(thinkingDiv);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                    
                    // 添加闪烁动画
                    const thinkingText = thinkingDiv.querySelector('.thinking-text');
                    thinkingText.style.animation = 'blink 1s infinite';
                    
                    // 发送请求
                    fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: message })
                    })
                    .then(response => response.json())
                    .then(data => {
                        // 移除思考中提示
                        document.getElementById(thinkingId).remove();
                        // 流式输出助手消息
                        streamMessageToHistory('assistant', data.response);
                    })
                    .catch(error => {
                        // 移除思考中提示
                        document.getElementById(thinkingId).remove();
                        console.error('发送消息失败:', error);
                        addMessageToHistory('assistant', '发送消息失败，请重试');
                    });
                });
            }
            
            // 清空历史
            const clearHistoryBtn = document.getElementById('clear-history');
            if (clearHistoryBtn) {
                clearHistoryBtn.addEventListener('click', function() {
                    if (confirm('确定要清空对话历史吗？')) {
                        fetch('/api/clear-history', {
                            method: 'POST'
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                document.getElementById('chat-history').innerHTML = '';
                            }
                        });
                    }
                });
            }
            
            // 保存配置
            const configForm = document.getElementById('config-form');
            if (configForm) {
                configForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const formData = new FormData(this);
                    const configData = {};
                    formData.forEach((value, key) => {
                        if (key === 'temperature' || key === 'max_tokens') {
                            configData[key] = parseFloat(value);
                        } else {
                            configData[key] = value;
                        }
                    });
                    
                    fetch('/api/config', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(configData)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            alert('配置保存成功！');
                        }
                    })
                    .catch(error => {
                        console.error('保存配置失败:', error);
                        alert('保存配置失败，请重试');
                    });
                });
            }
        });
        
        // 渲染Markdown
        function renderMarkdown(text) {
            try {
                // 处理换行
                text = text.replace(/\n/g, '<br>');
                // 处理粗体
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                // 处理斜体
                text = text.replace(/(?<!\*)\*(?!\*)(.*?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
                // 处理代码块
                text = text.replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-100 p-2 rounded text-sm"><code>$1</code></pre>');
                // 处理行内代码
                text = text.replace(/`(.*?)`/g, '<code class="bg-gray-100 px-1 py-0.5 rounded text-sm">$1</code>');
                // 处理列表
                text = text.replace(/(^|\n)\s*\-\s(.*?)(?=\n|$)/g, '$1<li>$2</li>');
                text = text.replace(/(<li>.*?<\/li>)/gs, '<ul class="list-disc pl-5">$1</ul>');
                // 处理标题
                text = text.replace(/(^|\n)#\s(.*?)(?=\n|$)/g, '$1<h1 class="text-xl font-bold mb-2">$2</h1>');
                text = text.replace(/(^|\n)##\s(.*?)(?=\n|$)/g, '$1<h2 class="text-lg font-bold mb-2">$2</h2>');
                text = text.replace(/(^|\n)###\s(.*?)(?=\n|$)/g, '$1<h3 class="text-md font-bold mb-2">$2</h3>');
                // 处理链接
                text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" class="text-blue-500 underline">$1</a>');
                return text;
            } catch (error) {
                console.error('Markdown渲染错误:', error);
                return text;
            }
        }
        
        // 添加消息到历史
        function addMessageToHistory(role, content) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[80%] ${role === 'user' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'} p-3 rounded-lg shadow-sm">
                    ${renderMarkdown(content)}
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        // 流式输出消息
        function streamMessageToHistory(role, content) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[80%] ${role === 'user' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'} p-3 rounded-lg shadow-sm">
                    <span id="stream-content"></span>
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            const streamContent = messageDiv.querySelector('#stream-content');
            let index = 0;
            let currentContent = '';
            const interval = setInterval(() => {
                if (index < content.length) {
                    currentContent += content.charAt(index);
                    index++;
                    // 实时渲染Markdown
                    streamContent.innerHTML = renderMarkdown(currentContent);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                } else {
                    clearInterval(interval);
                }
            }, 20);
        }
    </script>
</body>
</html>
