<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain智能体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-4 flex-1 flex flex-col lg:flex-row gap-6">
            <!-- 配置面板 -->
            <div id="config-panel" class="lg:w-1/4 bg-white rounded-lg shadow-md p-6 transition-all duration-300 transform lg:translate-x-0 relative z-10">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold flex items-center">
                        <i class="fa fa-cog mr-2 text-blue-500"></i> 模型配置
                    </h2>
                    <button id="toggle-config" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                </div>
                <form id="config-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 地址</label>
                        <input type="text" id="api-base" name="api_base" value="{{ config.api_base }}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 密钥</label>
                        <input type="password" id="api-key" name="api_key" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ config.api_key|default('') }}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型</label>
                        <input type="text" id="model" name="model" value="{{ config.model }}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入模型名称">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">温度</label>
                        <input type="number" id="temperature" name="temperature" value="{{ config.temperature }}" step="0.1" min="0" max="2" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">最大令牌数</label>
                        <input type="number" id="max-tokens" name="max_tokens" value="{{ config.max_tokens }}" min="1" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">系统提示词</label>
                        <textarea id="system-prompt" name="system_prompt" rows="4" 
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ config.system_prompt }}</textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors flex items-center justify-center">
                        <i class="fa fa-save mr-2"></i> 保存配置
                    </button>
                </form>
            </div>
            <!-- 展开按钮 -->
            <div id="expand-btn" class="lg:w-12 lg:h-48 lg:flex items-center justify-center bg-green-500 text-white rounded-r-lg shadow-md p-2 hidden fixed left-0 top-10 z-20">
                <button id="toggle-expand" class="vertical-text font-bold hover:bg-green-600 transition-colors">
                    <i class="fa fa-cog mb-2"></i> 配置参数
                </button>
            </div>
            <!-- 对话面板 -->
            <div class="lg:w-2/4 flex flex-col transition-all duration-300 flex-1">
                <div class="bg-white rounded-lg shadow-md flex-1 flex flex-col h-full">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fa fa-comments mr-2 text-blue-500"></i> 智能对话
                        </h2>
                        <button id="clear-history" class="text-gray-500 hover:text-gray-700 flex items-center">
                            <i class="fa fa-trash mr-1"></i> 清空历史
                        </button>
                    </div>
                    <div id="chat-history" class="flex-1 p-4 overflow-y-auto space-y-4 max-h-[70vh] min-h-[400px]">
                        <!-- 对话历史将通过JavaScript动态添加 -->
                    </div>
                    <div class="p-4 border-t border-gray-200">
                        <form id="chat-form" class="flex gap-2">
                            <input type="text" id="message-input" placeholder="请输入消息..." 
                                   class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition-colors">
                                <i class="fa fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- 预览窗口 -->
            <div class="lg:w-1/4 flex flex-col transition-all duration-300 flex-1">
                <div class="bg-white rounded-lg shadow-md flex-1 flex flex-col h-full">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fa fa-file-text mr-2 text-green-500"></i> PRD预览
                        </h2>
                        <div class="flex gap-2">
                            <button id="edit-preview" class="text-gray-500 hover:text-gray-700 flex items-center">
                                <i class="fa fa-pencil mr-1"></i> 编辑
                            </button>
                            <button id="save-preview" class="text-gray-500 hover:text-gray-700 flex items-center hidden">
                                <i class="fa fa-save mr-1"></i> 保存
                            </button>
                            <button id="clear-preview" class="text-gray-500 hover:text-gray-700 flex items-center">
                                <i class="fa fa-trash mr-1"></i> 清空
                            </button>
                        </div>
                    </div>
                    <div id="preview-content" class="flex-1 p-4 overflow-y-auto space-y-4 max-h-[70vh] min-h-[400px]">
                        <!-- 预览内容将通过JavaScript动态添加 -->
                        <div class="text-gray-500 text-center py-8">
                            <i class="fa fa-file-o fa-3x mb-2"></i>
                            <p>PRD预览将显示在这里</p>
                        </div>
                    </div>
                    <div id="preview-editor" class="flex-1 p-4 hidden">
                        <textarea id="preview-textarea" class="w-full h-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="在此编辑PRD内容..."></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 配置面板收纳功能
            const toggleConfigBtn = document.getElementById('toggle-config');
            if (toggleConfigBtn) {
                toggleConfigBtn.addEventListener('click', function() {
                    const configPanel = document.getElementById('config-panel');
                    const expandBtn = document.getElementById('expand-btn');
                    const chatPanel = document.querySelector('[class*="lg:w-2/3"]');
                    
                    // 收纳配置面板
                    configPanel.classList.add('-translate-x-full');
                    setTimeout(() => {
                        configPanel.classList.add('hidden');
                        expandBtn.classList.remove('hidden');
                        if (chatPanel) {
                            chatPanel.classList.remove('lg:w-2/3');
                            chatPanel.classList.add('lg:w-full');
                        }
                    }, 300);
                });
            }
            
            // 展开配置面板
            const toggleExpandBtn = document.getElementById('toggle-expand');
            if (toggleExpandBtn) {
                toggleExpandBtn.addEventListener('click', function() {
                    const configPanel = document.getElementById('config-panel');
                    const expandBtn = document.getElementById('expand-btn');
                    const chatPanel = document.querySelector('[class*="lg:w-full"]');
                    
                    // 展开配置面板
                    expandBtn.classList.add('hidden');
                    configPanel.classList.remove('hidden');
                    setTimeout(() => {
                        configPanel.classList.remove('-translate-x-full');
                        if (chatPanel) {
                            chatPanel.classList.remove('lg:w-full');
                            chatPanel.classList.add('lg:w-2/3');
                        }
                    }, 10);
                });
            }
            
            // 发送消息
            const chatForm = document.getElementById('chat-form');
            if (chatForm) {
                chatForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const messageInput = document.getElementById('message-input');
                    const message = messageInput.value.trim();
                    if (!message) return;
                    
                    // 添加用户消息到界面
                    addMessageToHistory('user', message);
                    messageInput.value = '';
                    
                    // 显示思考中提示
                    const thinkingId = 'thinking-' + Date.now();
                    const chatHistory = document.getElementById('chat-history');
                    const thinkingDiv = document.createElement('div');
                    thinkingDiv.id = thinkingId;
                    thinkingDiv.className = 'flex justify-start';
                    thinkingDiv.innerHTML = `
                        <div class="max-w-[80%] bg-gray-100 text-gray-800 p-3 rounded-lg shadow-sm">
                            <span class="thinking-text">思考中...</span>
                        </div>
                    `;
                    chatHistory.appendChild(thinkingDiv);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                    
                    // 添加闪烁动画
                    const thinkingText = thinkingDiv.querySelector('.thinking-text');
                    thinkingText.style.animation = 'blink 1s infinite';
                    
                    // 发送请求
                    fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: message })
                    })
                    .then(response => response.json())
                    .then(data => {
                        // 移除思考中提示
                        document.getElementById(thinkingId).remove();
                        // 流式输出助手消息
                        streamMessageToHistory('assistant', data.response);
                    })
                    .catch(error => {
                        // 移除思考中提示
                        document.getElementById(thinkingId).remove();
                        console.error('发送消息失败:', error);
                        addMessageToHistory('assistant', '发送消息失败，请重试');
                    });
                });
            }
            
            // 清空历史
            const clearHistoryBtn = document.getElementById('clear-history');
            if (clearHistoryBtn) {
                clearHistoryBtn.addEventListener('click', function() {
                    if (confirm('确定要清空对话历史吗？')) {
                        fetch('/api/clear-history', {
                            method: 'POST'
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                document.getElementById('chat-history').innerHTML = '';
                            }
                        });
                    }
                });
            }
            
            // 清空预览
            const clearPreviewBtn = document.getElementById('clear-preview');
            if (clearPreviewBtn) {
                clearPreviewBtn.addEventListener('click', function() {
                    if (confirm('确定要清空PRD预览吗？')) {
                        const previewContent = document.getElementById('preview-content');
                        previewContent.innerHTML = `
                            <div class="text-gray-500 text-center py-8">
                                <i class="fa fa-file-o fa-3x mb-2"></i>
                                <p>PRD预览将显示在这里</p>
                            </div>
                        `;
                    }
                });
            }
            
            // 编辑预览
            const editPreviewBtn = document.getElementById('edit-preview');
            const savePreviewBtn = document.getElementById('save-preview');
            const previewContent = document.getElementById('preview-content');
            const previewEditor = document.getElementById('preview-editor');
            const previewTextarea = document.getElementById('preview-textarea');
            
            if (editPreviewBtn && savePreviewBtn) {
                editPreviewBtn.addEventListener('click', function() {
                    // 隐藏预览内容，显示编辑器
                    previewContent.classList.add('hidden');
                    previewEditor.classList.remove('hidden');
                    
                    // 显示保存按钮，隐藏编辑按钮
                    editPreviewBtn.classList.add('hidden');
                    savePreviewBtn.classList.remove('hidden');
                    
                    // 将预览内容转换为Markdown格式
                    let markdownContent = '';
                    const sections = previewContent.querySelectorAll('h1, h2, h3, div');
                    sections.forEach(section => {
                        if (section.tagName === 'H1') {
                            markdownContent += `# ${section.textContent}\n\n`;
                        } else if (section.tagName === 'H2') {
                            markdownContent += `## ${section.textContent}\n\n`;
                        } else if (section.tagName === 'H3') {
                            markdownContent += `### ${section.textContent}\n\n`;
                        } else {
                            // 提取文本内容，移除HTML标签
                            let text = section.textContent;
                            markdownContent += `${text}\n\n`;
                        }
                    });
                    
                    // 设置文本域内容
                    previewTextarea.value = markdownContent.trim();
                });
                
                savePreviewBtn.addEventListener('click', function() {
                    // 获取编辑后的内容
                    const editedContent = previewTextarea.value.trim();
                    
                    // 隐藏编辑器，显示预览内容
                    previewEditor.classList.add('hidden');
                    previewContent.classList.remove('hidden');
                    
                    // 显示编辑按钮，隐藏保存按钮
                    savePreviewBtn.classList.add('hidden');
                    editPreviewBtn.classList.remove('hidden');
                    
                    // 更新预览内容
                    if (editedContent) {
                        // 提取结构化内容
                        const structuredContent = extractStructuredContent(editedContent);
                        
                        // 生成预览内容
                        let previewHTML = '';
                        structuredContent.forEach(section => {
                            if (section.level === 1) {
                                previewHTML += `<h1 class="text-xl font-bold mb-2">${section.title}</h1>`;
                            } else if (section.level === 2) {
                                previewHTML += `<h2 class="text-lg font-bold mb-2">${section.title}</h2>`;
                            } else if (section.level === 3) {
                                previewHTML += `<h3 class="text-md font-bold mb-2">${section.title}</h3>`;
                            }
                            if (section.content) {
                                previewHTML += `<div class="ml-${section.level * 4}">${renderMarkdown(section.content)}</div>`;
                            }
                        });
                        
                        previewContent.innerHTML = previewHTML;
                    } else {
                        previewContent.innerHTML = `
                            <div class="text-gray-500 text-center py-8">
                                <i class="fa fa-file-o fa-3x mb-2"></i>
                                <p>PRD预览将显示在这里</p>
                            </div>
                        `;
                    }
                });
            }
            
            // 保存配置
            const configForm = document.getElementById('config-form');
            if (configForm) {
                configForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const formData = new FormData(this);
                    const configData = {};
                    formData.forEach((value, key) => {
                        if (key === 'temperature' || key === 'max_tokens') {
                            configData[key] = parseFloat(value);
                        } else {
                            configData[key] = value;
                        }
                    });
                    
                    fetch('/api/config', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(configData)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            alert('配置保存成功！');
                        }
                    })
                    .catch(error => {
                        console.error('保存配置失败:', error);
                        alert('保存配置失败，请重试');
                    });
                });
            }
        });
        
        // 渲染Markdown
        function renderMarkdown(text) {
            try {
                // 处理换行
                text = text.replace(/\n/g, '<br>');
                // 处理粗体（使用更可靠的正则表达式）
                text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                // 处理斜体
                text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
                // 处理代码块
                text = text.replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-100 p-2 rounded text-sm"><code>$1</code></pre>');
                // 处理行内代码
                text = text.replace(/`(.*?)`/g, '<code class="bg-gray-100 px-1 py-0.5 rounded text-sm">$1</code>');
                // 处理列表
                text = text.replace(/(^|\n)\s*\-\s(.*?)(?=\n|$)/g, '$1<li>$2</li>');
                text = text.replace(/(<li>.*?<\/li>)/gs, '<ul class="list-disc pl-5">$1</ul>');
                // 处理标题
                text = text.replace(/(^|\n)#\s(.*?)(?=\n|$)/g, '$1<h1 class="text-xl font-bold mb-2">$2</h1>');
                text = text.replace(/(^|\n)##\s(.*?)(?=\n|$)/g, '$1<h2 class="text-lg font-bold mb-2">$2</h2>');
                text = text.replace(/(^|\n)###\s(.*?)(?=\n|$)/g, '$1<h3 class="text-md font-bold mb-2">$2</h3>');
                // 处理链接
                text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" class="text-blue-500 underline">$1</a>');
                return text;
            } catch (error) {
                console.error('Markdown渲染错误:', error);
                return text;
            }
        }
        
        // 添加消息到历史
        function addMessageToHistory(role, content) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[80%] ${role === 'user' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'} p-3 rounded-lg shadow-sm">
                    ${renderMarkdown(content)}
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        // 过滤AI交互引导语
        function filterContent(content) {
            // 过滤掉常见的AI交互引导语
            const patterns = [
                /^您好！.*?开始。/, // 匹配开头的问候语
                /^我们需要分阶段完成.*?开始。/, // 匹配阶段说明
                /^请您先提供以上模块.*?编写。/, // 匹配请求用户输入的语句
                /^请您提供.*?信息，我们完成后再进入下一模块。/, // 匹配请求用户输入的语句
                /^请您先提供.*?信息，我们完成后再进入模块.*?的编写。/, // 匹配请求用户输入的语句
                /^我将引导您完成.*?PRD文档编写。/, // 匹配引导语
                /^现在开始.*?模块的编写。/, // 匹配模块开始语
                /^接下来.*?模块的内容。/, // 匹配模块转换语
                /^请提供.*?信息，以便我继续编写。/ // 匹配请求信息的语句
            ];
            
            let filteredContent = content;
            patterns.forEach(pattern => {
                filteredContent = filteredContent.replace(pattern, '');
            });
            
            return filteredContent.trim();
        }
        
        // 提取结构化内容
        function extractStructuredContent(content) {
            // 提取PRD文档的结构化内容
            // 基于标题层级进行结构化
            const lines = content.split('\n');
            const structuredContent = [];
            let currentSection = null;
            
            lines.forEach(line => {
                line = line.trim();
                if (line === '') return;
                
                // 匹配标题
                const headingMatch = line.match(/^(#{1,3})\s+(.*)$/);
                if (headingMatch) {
                    const level = headingMatch[1].length;
                    const title = headingMatch[2];
                    currentSection = {
                        level,
                        title,
                        content: ''
                    };
                    structuredContent.push(currentSection);
                } else if (currentSection) {
                    // 添加内容到当前章节
                    currentSection.content += line + '\n';
                }
            });
            
            return structuredContent;
        }
        
        // 全局变量存储当前预览的结构化内容
        let currentStructuredContent = [];
        
        // 检测内容是否包含新的PRD章节
        function detectNewSection(content) {
            // 检查是否包含PRD章节标题
            const sectionPatterns = [
                /^#\s+.+$/, // 一级标题
                /^##\s+.+$/, // 二级标题
                /^###\s+.+$/, // 三级标题
                /^模块\d+：.+$/, // 模块标题
                /^###\s*[一二三四五六七八九十]+、.+$/, // 中文序号标题
                /^\d+\.\s+.+$/, // 数字序号标题
                /^[一二三四五六七八九十]+、.+$/ // 中文序号标题
            ];
            
            return sectionPatterns.some(pattern => pattern.test(content));
        }
        
        // 检测内容是否包含阶段完成提示
        function detectStageCompletion(content) {
            // 检查是否包含阶段完成的提示词
            const completionPatterns = [
                /模块.*?编写完成/, // 模块完成
                /章节.*?编写完成/, // 章节完成
                /阶段.*?完成/, // 阶段完成
                /本模块.*?结束/, // 模块结束
                /此章节.*?结束/, // 章节结束
                /以上是.*?内容/, // 内容总结
                /请您.*?信息/, // 请求用户输入
                /需要您提供.*?信息/ // 请求用户输入
            ];
            
            return completionPatterns.some(pattern => pattern.test(content));
        }
        
        // 更新预览窗口
        function updatePreview(content) {
            // 过滤AI交互引导语
            const filteredContent = filterContent(content);
            if (!filteredContent) return;
            
            // 检测是否包含新章节或阶段完成
            const hasNewSection = detectNewSection(filteredContent);
            const hasStageCompletion = detectStageCompletion(filteredContent);
            
            // 只有当检测到新章节或阶段完成时才更新预览
            if (!hasNewSection && !hasStageCompletion) return;
            
            // 提取结构化内容
            const newStructuredContent = extractStructuredContent(filteredContent);
            
            // 合并结构化内容（增量更新）
            newStructuredContent.forEach(newSection => {
                // 检查是否已存在相同标题的章节
                const existingSectionIndex = currentStructuredContent.findIndex(
                    section => section.title === newSection.title && section.level === newSection.level
                );
                
                if (existingSectionIndex >= 0) {
                    // 更新现有章节内容
                    currentStructuredContent[existingSectionIndex].content = newSection.content;
                } else {
                    // 添加新章节
                    currentStructuredContent.push(newSection);
                }
            });
            
            // 按标题层级排序
            currentStructuredContent.sort((a, b) => {
                if (a.level !== b.level) {
                    return a.level - b.level;
                }
                return a.title.localeCompare(b.title);
            });
            
            // 生成预览内容
            let previewHTML = '';
            currentStructuredContent.forEach(section => {
                if (section.level === 1) {
                    previewHTML += `<h1 class="text-xl font-bold mb-2">${section.title}</h1>`;
                } else if (section.level === 2) {
                    previewHTML += `<h2 class="text-lg font-bold mb-2">${section.title}</h2>`;
                } else if (section.level === 3) {
                    previewHTML += `<h3 class="text-md font-bold mb-2">${section.title}</h3>`;
                }
                if (section.content) {
                    previewHTML += `<div class="ml-${section.level * 4}">${renderMarkdown(section.content)}</div>`;
                }
            });
            
            const previewContent = document.getElementById('preview-content');
            previewContent.innerHTML = previewHTML || `
                <div class="text-gray-500 text-center py-8">
                    <i class="fa fa-file-o fa-3x mb-2"></i>
                    <p>PRD预览将显示在这里</p>
                </div>
            `;
        }
        
        // 流式输出消息
        function streamMessageToHistory(role, content) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[80%] ${role === 'user' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'} p-3 rounded-lg shadow-sm">
                    <span id="stream-content"></span>
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            const streamContent = messageDiv.querySelector('#stream-content');
            let index = 0;
            let currentContent = '';
            const interval = setInterval(() => {
                if (index < content.length) {
                    currentContent += content.charAt(index);
                    index++;
                    // 实时渲染Markdown
                    streamContent.innerHTML = renderMarkdown(currentContent);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                } else {
                    clearInterval(interval);
                    // 更新预览窗口
                    updatePreview(content);
                }
            }, 20);
        }
    </script>
</body>
