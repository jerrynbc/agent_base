<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain智能体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- 配置面板 -->
            <div class="lg:w-1/3 bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fa fa-cog mr-2 text-blue-500"></i> 模型配置
                </h2>
                <form id="config-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 地址</label>
                        <input type="text" id="api-base" name="api_base" value="{{ config.api_base }}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 密钥</label>
                        <input type="password" id="api-key" name="api_key" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型</label>
                        <input type="text" id="model" name="model" value="{{ config.model }}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入模型名称">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">温度</label>
                        <input type="number" id="temperature" name="temperature" value="{{ config.temperature }}" step="0.1" min="0" max="2" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">最大令牌数</label>
                        <input type="number" id="max-tokens" name="max_tokens" value="{{ config.max_tokens }}" min="1" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">系统提示词</label>
                        <textarea id="system-prompt" name="system_prompt" rows="4" 
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ config.system_prompt }}</textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors flex items-center justify-center">
                        <i class="fa fa-save mr-2"></i> 保存配置
                    </button>
                </form>
            </div>
            
            <!-- 对话面板 -->
            <div class="lg:w-2/3 flex flex-col">
                <div class="bg-white rounded-lg shadow-md flex-1 flex flex-col">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fa fa-comments mr-2 text-blue-500"></i> 智能对话
                        </h2>
                        <button id="clear-history" class="text-gray-500 hover:text-gray-700 flex items-center">
                            <i class="fa fa-trash mr-1"></i> 清空历史
                        </button>
                    </div>
                    <div id="chat-history" class="flex-1 p-4 overflow-y-auto space-y-4">
                        <!-- 对话历史将通过JavaScript动态添加 -->
                    </div>
                    <div class="p-4 border-t border-gray-200">
                        <form id="chat-form" class="flex gap-2">
                            <input type="text" id="message-input" placeholder="请输入消息..." 
                                   class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition-colors">
                                <i class="fa fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 保存配置
        document.getElementById('config-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const configData = {};
            formData.forEach((value, key) => {
                if (key === 'temperature' || key === 'max_tokens') {
                    configData[key] = parseFloat(value);
                } else {
                    configData[key] = value;
                }
            });
            
            fetch('/api/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(configData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('配置保存成功！');
                }
            })
            .catch(error => {
                console.error('保存配置失败:', error);
                alert('保存配置失败，请重试');
            });
        });
        
        // 发送消息
        document.getElementById('chat-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            if (!message) return;
            
            // 添加用户消息到界面
            addMessageToHistory('user', message);
            messageInput.value = '';
            
            // 发送请求
            fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                // 添加助手消息到界面
                addMessageToHistory('assistant', data.response);
            })
            .catch(error => {
                console.error('发送消息失败:', error);
                addMessageToHistory('assistant', '发送消息失败，请重试');
            });
        });
        
        // 清空历史
        document.getElementById('clear-history').addEventListener('click', function() {
            if (confirm('确定要清空对话历史吗？')) {
                fetch('/api/clear-history', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('chat-history').innerHTML = '';
                    }
                });
            }
        });
        
        // 添加消息到历史
        function addMessageToHistory(role, content) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[80%] ${role === 'user' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'} p-3 rounded-lg shadow-sm">
                    ${content}
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
